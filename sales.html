<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILLSEN ELECTRICS</title>

     <link rel="icon" type="image/png" href="favicon.png">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

         <div class="logo">
    <img src="logo.png" alt="WILLSEN Logo">
</div>

        <nav>

           <a href="index.html">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
          </a>

         <a href="dispatch.html">
             <i class="fa-solid fa-truck"></i>
             <span>Dispatch</span>
        </a>

            <a href="sales.html" class="active">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Sales</span>
            </a>

            <a href="shop-stock.html">
                <i class="fa-solid fa-box"></i>
                <span>Shop Stock</span>
            </a>

            <a href="history.html">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>History</span>
            </a>

            <a href="backup-report.html">
                <i class="fa-solid fa-file-pdf"></i>
                <span>Reports</span>
            </a>

        </nav>

    </aside>

    <main class="content">

    <!-- Main Content -->
   <div class="sales-container">

    <!-- Left Side -->
    <div class="sales-form">

        <h2>New Sale</h2>

        <div class="form-section">

    <div class="section-title">
        <i class="fa-solid fa-user"></i>
        <span>Customer Details</span>
    </div>

    <div class="input-row">

        <div class="input-group">
            <label>Date</label>
            <input type="date" id="saleDate">
        </div>

    </div>

    <div class="input-row">

        <div class="input-group">
            <label>Customer Name</label>
            <input
                type="text"
                id="customerName"
                placeholder="Enter customer name">
        </div>

        <div class="input-group">
            <label>Mobile Number</label>
            <input
                type="text"
                id="customerMobile"
                placeholder="Enter mobile number">
        </div>

    </div>

</div>

        <!-- Product Details -->
        <div class="form-section">

            <h3>Product Details</h3>

        

        <div class="input-row">

    <div class="input-group">

        <label>Product Code</label>

        <select id="productCode">

            <option value="">Select Product Code</option>

        </select>

    </div>

    <div class="input-group">

        <label>Product Name</label>

        <input
            type="text"
            id="productName"
            readonly>

    </div>

</div>

<div class="input-row">

    <div class="input-group">

        <label>Quantity</label>

        <input
            type="number"
            id="saleQuantity"
            placeholder="Enter Quantity">

    </div>

    <div class="input-group">

        <label>Rate</label>

        <input
    type="number"
    id="saleRate"
    placeholder="Product Price"
    readonly>

    </div>

</div>

<div class="input-row">

    <div class="input-group">

        <label>Total Amount</label>

        <input
            type="text"
            id="totalAmount"
            value="₹ 0.00"
            readonly>

    </div>

</div>

<div class="button-row">

    <button type="button" id="addProductBtn">
        + Add Product
    </button>

</div>

<div class="product-list">

    <table>

        <thead>

            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Rate</th>
                <th>Total</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="billItems">

        </tbody>

    </table>

</div>

<div class="grand-total">

    <h2>
        Grand Total :
        <span id="grandTotal">₹ 0.00</span>
    </h2>

</div>

</div>

        <!-- Save Button -->
        <button id="saveSaleBtn">
            Save Bill
        </button>

    </div>

    <!-- Right Side -->
    <div class="today-sales">

        <h2>Today's Sales</h2>

<div class="table-container">

    <table>

        <thead>

            <tr>

                <th>Date</th>
                <th>Customer</th>
                <th>Product</th>
                <th>Qty</th>
                <th>Rate</th>
                <th>Total</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="salesTable">

            <tr>

                <td colspan="7" class="empty-row">

                    No Sales Found

                </td>

            </tr>

        </tbody>

    </table>

</div>



</main>

    </div>

<script src="js/products.js"></script>
<script src="js/sales.js"></script>

</body>
</html>
