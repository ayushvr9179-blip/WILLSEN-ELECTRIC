<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop Stock | WILLSEN ELECTRICS</title>

     <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="app">

    <!-- Sidebar -->

    <aside class="sidebar">

         <div class="logo">
    <img src="logo.png" alt="WILLSEN Logo">
</div>

        <nav>

            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <a href="dispatch.html">
                <i class="fa-solid fa-truck"></i>
                Dispatch
            </a>

            <a href="sales.html">
                <i class="fa-solid fa-cart-shopping"></i>
                Sales
            </a>

            <a href="shop-stock.html" class="active">
                <i class="fa-solid fa-box"></i>
                Shop Stock
            </a>

            <a href="history.html">
                <i class="fa-solid fa-clock-rotate-left"></i>
                History
            </a>

            <a href="backup-report.html">
                <i class="fa-solid fa-file-pdf"></i>
                Reports
            </a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="content">

        <header class="topbar">

            <h1>Current Shop Stock</h1>

        </header>

        <section class="activity">

            <div class="section-header">

                <h2>Stock List</h2>

                <div class="search-box">

    <input
        type="text"
        id="stockSearch"
        placeholder="Search by Code or Product Name">

</div>

            </div>

            <table>

                <thead>

                    <tr>

                        <th>Code</th>
                        <th>Product Name</th>
                        <th>Current Stock</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="stockTable">

                </tbody>

            </table>

        </section>

    </main>

</div>

<!-- =========================
     Edit Stock Modal
========================= -->

<div id="editStockModal" class="modal">

    <div class="modal-content">

        <h2>Edit Stock</h2>

        <p id="editProductName"></p>

        <label>Current Stock</label>

        <input
            type="number"
            id="currentStock"
            readonly>

        <label>New Stock</label>

        <input
            type="number"
            id="newStock"
            placeholder="Enter New Stock">

        <div class="modal-buttons">

            <button
                id="saveStockBtn">

                Save

            </button>

            <button
                id="cancelStockBtn">

                Cancel

            </button>

        </div>

    </div>

</div>

<script src="js/products.js"></script>
<script src="js/stock.js"></script>

</body>
</html>
